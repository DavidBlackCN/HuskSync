loom {
    serverOnlyMinecraftJar()
    runs {
        server {
            runDir 'run'
        }
    }
}

repositories {
    maven { url 'https://maven.nucleoid.xyz' }
}

sourceSets {
    main {
        java.srcDirs '../src/main/java'
        resources.srcDirs '../src/main/resources'
    }
    test {
        java.srcDirs '../src/test/java'
        resources.srcDirs '../src/test/resources'
    }
}

def commonProject = rootProject.project(':common')

dependencies {
    minecraft "com.mojang:minecraft:${project.name}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation include("net.kyori:adventure-platform-fabric:${fabric_adventure_platform_version}")
    implementation include("me.lucko:fabric-permissions-api:${fabric_permissions_api_version}")
    implementation include("eu.pb4:sgui:${fabric_sgui_version}")
    implementation include('net.william278.uniform:uniform-common:1.3.9')
    implementation include('net.william278.toilet:toilet-common:1.1.2')

    implementation include(project(path: ':common'))
    commonProject.configurations.api.dependencies.each { dependency ->
        include(dependency)
    }

    // Fabric has no runtime library downloader; ship the database and Redis drivers.
    implementation include('de.exlll:configlib-core:4.8.1')
    implementation include('org.snakeyaml:snakeyaml-engine:3.0.1')
    implementation include("com.mysql:mysql-connector-j:$mysql_driver_version")
    implementation include("org.postgresql:postgresql:$postgres_driver_version")
    implementation include("org.mariadb.jdbc:mariadb-java-client:$mariadb_driver_version")
    implementation include("org.mongodb:mongodb-driver-sync:$mongodb_driver_version")
    implementation include("org.mongodb:mongodb-driver-core:$mongodb_driver_version")
    implementation include("org.mongodb:bson:$mongodb_driver_version")
    implementation include("org.xerial.snappy:snappy-java:$snappy_version")
    implementation include("io.lettuce:lettuce-core:$lettuce_version")
    implementation include("org.apache.commons:commons-pool2:$commons_pool_version")
    implementation include('redis.clients.authentication:redis-authx-core:0.1.1-beta2')
    implementation include('io.projectreactor:reactor-core:3.6.6')
    implementation include('org.reactivestreams:reactive-streams:1.0.4')

    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

processResources {
    inputs.properties([
            version: project.version.toString(),
            description: rootProject.description,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version,
            minecraft_version_range: minecraft_version_range
    ])
    filesMatching(['fabric.mod.json', 'compatibility.yml']) {
        expand([
                version: version,
                description: rootProject.description,
                fabric_loader_version: fabric_loader_version,
                fabric_api_version: fabric_api_version,
                minecraft_version_range: minecraft_version_range
        ])
    }
}

jar {
    from rootProject.file('LICENSE')
    destinationDirectory.set(file("$rootDir/target"))
    archiveClassifier.set('')
}

// Loom's ordinary jar task packages nested dependencies for Minecraft 26.3.
shadowJar.enabled = false
